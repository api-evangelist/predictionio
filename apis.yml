aid: predictionio
name: PredictionIO
description: >-
  Apache PredictionIO is an open source machine learning server that lets
  developers and data scientists build, deploy, and serve predictive engines as
  web services. Originally the commercial product prediction.io from TappingStone,
  it was acquired by Salesforce in 2016, donated to the Apache Software Foundation,
  and graduated as a top-level Apache project before being retired to the Apache
  Attic. It exposes a REST-based Event Server for collecting event data and an
  Engine Query API for real-time predictions, built on Apache Spark, MLlib, HBase,
  Elasticsearch, and Akka HTTP, with official SDKs for Python, Ruby, PHP, and
  Scala/Java. This profile enriches the original portfolio-lead stub.
